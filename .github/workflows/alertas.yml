name: Alertas de minimos

# Se lanza desde cron-job.org (hora exacta, zona Europe/Madrid) o a mano desde Actions.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué ejecutar"
        type: choice
        options: [alertas, resumen]
        default: alertas

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python alertas_minimos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || 'alertas' }}
