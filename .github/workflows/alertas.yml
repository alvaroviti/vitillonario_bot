name: Alertas de minimos

on:
  schedule:
    - cron: "30 15 * * 1-5"  # alertas 16:30 hora española (invierno), lunes a viernes
    - cron: "0 19 * * *"     # alertas 20:00 hora española (invierno), todos los días
    - cron: "0 11 * * 0"     # resumen semanal, domingo 12:00 hora española (invierno)
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué ejecutar"
        type: choice
        options: [alertas, resumen]
        default: alertas

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python alertas_minimos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 11 * * 0' && 'resumen') || 'alertas' }}
